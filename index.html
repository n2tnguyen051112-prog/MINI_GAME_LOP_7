<!doctype html>
<html data-subject="portal" lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121847">
<meta name="description" content="Trạm mini game lớp 7 Trường THCS Vĩnh An: GDCD 7, Lịch sử – Địa lí 7 và Tiếng Anh 7.">
<title>Trạm Mini Game Lớp 7 | THCS Vĩnh An</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#1c2447;background:#111747;font-synthesis:none}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;min-height:100svh;background:radial-gradient(circle at 10% 0%,#4949b4 0,transparent 34%),radial-gradient(circle at 100% 35%,#116a8b 0,transparent 40%),linear-gradient(145deg,#17164b,#0b143c);color:#fff}
a{color:inherit}
a:focus-visible{outline:4px solid #ffe16b;outline-offset:5px}
main{max-width:1020px;margin:0 auto;padding:24px 18px calc(54px + env(safe-area-inset-bottom))}
.brand{display:flex;align-items:center;justify-content:center;gap:10px;font-size:12px;letter-spacing:.045em;font-weight:800;color:#e0edff}
.brand-icon{display:grid;place-items:center;width:35px;height:35px;background:#fff;color:#3543a0;border-radius:12px;font-size:22px;box-shadow:0 6px 22px #080e3466}
.hero{text-align:center;margin:29px auto 30px}
.eyebrow{display:inline-block;padding:7px 13px;border-radius:30px;border:1px solid #ffffff35;background:#ffffff16;color:#f0f5ff;font-size:12px;font-weight:750}
h1{font-size:clamp(34px,6.9vw,60px);font-weight:900;line-height:1.1;letter-spacing:-.05em;margin:17px 0 0}
h1 span{display:block;color:#ffe68b;margin-top:4px}
.station{background:#f7f8ff;color:#222b52;border-radius:29px;padding:25px;box-shadow:0 25px 65px #040b2c75}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.subject{display:flex;flex-direction:column;min-width:0;min-height:268px;padding:19px;border-radius:23px;text-decoration:none;border:2px solid transparent;box-shadow:0 6px 25px #28335412;transition:transform .15s ease,box-shadow .15s ease}
.subject:hover{transform:translateY(-4px);box-shadow:0 14px 30px #26315424}
.subject.gdcd{background:linear-gradient(150deg,#fff0f1,#ffe0ea);border-color:#ffc4d7}
.subject.lsdl{background:linear-gradient(150deg,#e6f3ff,#d9eaff);border-color:#c0defd}
.subject.eng{background:linear-gradient(150deg,#eafff4,#d8f8e7);border-color:#b8eed6}
.emoji{display:grid;place-items:center;width:68px;height:68px;background:#ffffffb5;border-radius:21px;font-size:35px;margin-bottom:19px;box-shadow:0 4px 13px #27326a0d}
h2{margin:0;font-size:clamp(20px,2.6vw,24px);font-weight:860;letter-spacing:-.035em;line-height:1.24;flex:1}
.play{display:flex;align-items:center;justify-content:space-between;gap:10px;color:#fff;border-radius:13px;padding:13px 15px;font-size:15px;font-weight:850;margin-top:19px;min-height:49px}
.gdcd .play{background:#cc4770}.lsdl .play{background:#2476b9}.eng .play{background:#1b916a}
.play .arrow{font-size:23px;line-height:1}
@media(max-width:720px){main{padding:19px 13px calc(35px + env(safe-area-inset-bottom))}.hero{margin:25px auto 25px}.station{padding:14px;border-radius:23px}.grid{grid-template-columns:1fr;gap:12px}.subject{min-height:auto;padding:16px;display:grid;grid-template-columns:64px minmax(0,1fr);column-gap:14px;align-items:center}.emoji{width:62px;height:62px;font-size:32px;margin:0;grid-row:1/3}.subject h2{grid-column:2;font-size:20px}.subject .play{grid-column:1/3;margin-top:15px}.brand{font-size:11px}}
@media(min-width:721px) and (max-width:840px){.station{padding:16px}.subject{padding:15px}.emoji{width:61px;height:61px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.subject{transition:none}.subject:hover{transform:none}}
#playstats-gate{position:fixed;inset:0;z-index:2147483646;display:grid;place-items:center;padding:20px;background:rgba(9,18,42,.9);color:#17233d;overflow:auto}
#playstats-gate .playstats-panel{background:#fff;border-radius:20px;padding:24px;width:min(100%,440px);box-shadow:0 20px 70px rgba(0,0,0,.26);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;text-align:left}
#playstats-gate h2{font-size:23px;font-weight:800;line-height:1.3;color:#182447;margin:0 0 8px}
#playstats-gate p{font-size:14px;color:#495670;line-height:1.5;margin:8px 0 16px}
#playstats-gate label{display:block;font-weight:700;color:#24354f;font-size:14px;margin:13px 0 6px}
#playstats-gate input{display:block;width:100%;font-family:inherit;font-size:16px;border:1px solid #b9c9df;border-radius:11px;padding:12px;background:#fff;color:#17233d}
#playstats-gate button{margin-top:14px;width:100%;border:0;border-radius:12px;padding:14px;background:#1560bd;color:#fff;font-weight:800;font-family:inherit;font-size:16px;min-height:48px;cursor:pointer}
#playstats-gate .playstats-privacy{font-size:12px;color:#596781;margin-top:14px}
.player-small{text-align:center;font-size:13px;color:#e0e9ff;margin:18px 0 0}.player-small button{font:inherit;border:1px solid #ffffff60;background:#ffffff20;color:#fff;border-radius:9px;padding:5px 10px;margin-left:6px;cursor:pointer}
</style>
<script src="./config.js"></script>
<script src="./tracker.js"></script>

</head>
<body>
<main>
  <header class="brand"><span class="brand-icon" aria-hidden="true">🎒</span><span>TRƯỜNG THCS VĨNH AN</span></header>
  <section class="hero" aria-labelledby="title">
    <span class="eyebrow">ÔN TẬP GIỮA HỌC KÌ I · 2026–2027</span>
    <h1 id="title">TRẠM MINI GAME <span>LỚP 7</span></h1>
  </section>
  <nav class="station" aria-label="Các mini game môn học">
    <div class="grid">
      <a class="subject gdcd" href="https://n2tnguyen051112-prog.github.io/GHK_I_GDCD_7/" aria-label="Vào mini game Giáo dục công dân 7">
        <span class="emoji" aria-hidden="true">🤝</span>
        <h2>Giáo dục công dân 7</h2>
        <span class="play">Vào chơi <span class="arrow" aria-hidden="true">→</span></span>
      </a>
      <a class="subject lsdl" href="https://n2tnguyen051112-prog.github.io/GHK_I_LSDL_7/" aria-label="Vào mini game Lịch sử – Địa lí 7">
        <span class="emoji" aria-hidden="true">🌍</span>
        <h2>Lịch sử – Địa lí 7</h2>
        <span class="play">Vào chơi <span class="arrow" aria-hidden="true">→</span></span>
      </a>
      <a class="subject eng" href="https://n2tnguyen051112-prog.github.io/GHK_I_TIENG_ANH_7/" aria-label="Vào mini game Tiếng Anh 7">
        <span class="emoji" aria-hidden="true">🎧</span>
        <h2>Tiếng Anh 7</h2>
        <span class="play">Vào chơi <span class="arrow" aria-hidden="true">→</span></span>
      </a>
    </div>
  </nav>
  <p class="player-small"><span id="player-label"></span> <button id="change-player" type="button">Đổi tên</button></p>
</main>
</body>
</html>
